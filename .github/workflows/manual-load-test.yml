name: Temporary PulsePoll Load Test

on:
  push:
    branches:
      - feat/initial-polling-vertical-slice
    paths:
      - .github/workflows/manual-load-test.yml

jobs:
  staged-load-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/initial-polling-vertical-slice

      - uses: grafana/setup-k6-action@v1

      - name: 10 users
        run: k6 run -e BASE_URL=https://polling-software.vercel.app -e SESSION_CODE=LYXUQQ -e VUS=10 load-tests/staged-production.js

      - name: 50 users
        run: k6 run -e BASE_URL=https://polling-software.vercel.app -e SESSION_CODE=LYXUQQ -e VUS=50 load-tests/staged-production.js

      - name: 100 users
        run: k6 run -e BASE_URL=https://polling-software.vercel.app -e SESSION_CODE=LYXUQQ -e VUS=100 load-tests/staged-production.js
